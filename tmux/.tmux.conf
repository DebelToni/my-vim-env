run-shell " \
  mkdir -p ~/.tmux/plugins && \
  if [ ! -d ~/.tmux/plugins/tpm ]; then \
    git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm; \
  fi \
"

set-option -g status-position top
# List of TPM-managed plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_flavor 'mocha'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-zoxide-mode 'on'
#####
# set -g @plugin 'tmux-plugins/tmux-yank'

# set -g default-terminal 'tmux-256color'
set -g default-terminal 'screen-256color'
# set -as terminal-overrides ',xterm-256color:Tc'
set -ga terminal-overrides ',*:E3='

# tmux-resurrect configurations
set -g @resurrect-save 15
set -g @resurrect-restore-script-path "/home/bananc/.tmux/plugins/tmux-resurrect/scripts/restore.sh"
set -g @resurrect-save-script-path "/home/bananc/.tmux/plugins/tmux-resurrect/scripts/save.sh"
set -g @resurrect-strategy-irb "default_strategy"
set -g @resurrect-strategy-mosh-client "default_strategy"

# TMUX settings
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g prefix C-a
unbind C-b
bind C-a send-prefix
# set -g default-shell /usr/bin/zsh
if-shell 'uname | grep -q Darwin' \
  "set -g default-shell /opt/homebrew/bin/zsh" \
  "set -g default-shell /usr/bin/zsh"

set -g status on
set -g status-bg colour235
set -g status-fg white
set -g status-left "[#{session_name}] "
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" %H:%M %d-%b-%y"
set -g base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g detach-on-destroy off

set -s user-keys[0] "\e[7721u"
set -s user-keys[1] "\e[7722u"
set -s user-keys[2] "\e[7731u"
set -s user-keys[3] "\e[7732u"
set -s user-keys[4] "\e[7733u"
set -s user-keys[5] "\e[7734u"
set -s user-keys[6] "\e[7735u"
set -s user-keys[7] "\e[7736u"
set -s user-keys[8] "\e[7737u"
set -s user-keys[9] "\e[7738u"
set -s user-keys[10] "\e[7739u"
bind -n User0 switch-client -p
bind -n User1 switch-client -n
bind -n User2 select-window -t :1
bind -n User3 select-window -t :2
bind -n User4 select-window -t :3
bind -n User5 select-window -t :4
bind -n User6 select-window -t :5
bind -n User7 select-window -t :6
bind -n User8 select-window -t :7
bind -n User9 select-window -t :8
bind -n User10 select-window -t :9
bind Up switch-client -p
bind Down switch-client -n

bind -n C-h select-pane -L
bind -n C-j select-pane -U
bind -n C-k select-pane -D
bind -n C-l select-pane -R

bind-key x kill-pane

bind -T choose-tree j send-keys Down 
bind -T choose-tree k send-keys Up

bind C-s run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"
#where C-r dont know but works

# bind-key <Up> resize-pane -U 5
# bind-key <Down> resize-pane -D 5
# bind-key <Left> resize-pane -L 5
# bind-key <Right> resize-pane -R 5

bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 3
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 3
# set-option -g clipboard on

bind-key ";" command-prompt 

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
# set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_right "date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"
# TMUX COPY MODE
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection     # Begin selection in copy mode.
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle  # Begin selection in copy mode.
bind-key -T copy-mode-vi 'y' send -X copy-selection      # Yank selection in copy mode.
unbind-key -T copy-mode-vi v

# Initialize TPM (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'


set -g allow-passthrough on
set -g set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'

set -g mouse on
set -g history-limit 100000

# this works from the shell:
# bind-key g send-keys "open $(git remote get-url origin)" Enter
# this works from any TUI:
bind-key g run-shell -b '
  cd "#{pane_current_path}" || exit
  if command -v gh >/dev/null 2>&1; then
    gh repo view --web >/dev/null 2>&1
  else
    url=$(git remote get-url origin 2>/dev/null) || { tmux display-message "No git remote here"; exit 0; }
    url=$(printf "%s" "$url" | sed -E "s#(git@|ssh://git@)([^:/]+)[:/]([^/]+)/([^/]+)(\\.git)?#https://\\2/\\3/\\4#")
    open -g "$url"
  fi
'

# this code cannot be more self explenatiory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# bind c new-window -c "#{pane_current_path}"
