run-shell " \
  mkdir -p ~/.tmux/plugins && \
  if [ ! -d ~/.tmux/plugins/tpm ]; then \
    git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm; \
  fi \
"

set-option -g status-position top
# List of TPM-managed plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_flavor 'mocha'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
#####
# set -g @plugin 'tmux-plugins/tmux-yank'

# set -g default-terminal 'tmux-256color'
set -g default-terminal 'screen-256color'
# set -as terminal-overrides ',xterm-256color:Tc'

# tmux-resurrect configurations
set -g @resurrect-save 15
set -g @resurrect-restore-script-path "/home/bananc/.tmux/plugins/tmux-resurrect/scripts/restore.sh"
set -g @resurrect-save-script-path "/home/bananc/.tmux/plugins/tmux-resurrect/scripts/save.sh"
set -g @resurrect-strategy-irb "default_strategy"
set -g @resurrect-strategy-mosh-client "default_strategy"

# TMUX settings
set -g mouse on
set -g prefix C-a
# set -g default-shell /usr/bin/zsh
if-shell 'uname | grep -q Darwin' \
  "set -g default-shell /opt/homebrew/bin/zsh" \
  "set -g default-shell /usr/bin/zsh"

set -g status on
set -g status-bg colour235
set -g status-fg white
set -g status-left "[#{session_name}] "
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" %H:%M %d-%b-%y"
set -g base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g detach-on-destroy off

bind -n C-h select-pane -L
bind -n C-j select-pane -U
bind -n C-k select-pane -D
bind -n C-l select-pane -R

bind-key x kill-pane

bind -T choose-tree j send-keys Down 
bind -T choose-tree k send-keys Up

bind C-s run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"
#where C-r dont know but works

# bind-key <Up> resize-pane -U 5
# bind-key <Down> resize-pane -D 5
# bind-key <Left> resize-pane -L 5
# bind-key <Right> resize-pane -R 5

bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 3
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 3
# set-option -g clipboard on

bind-key ";" command-prompt 

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"
# TMUX COPY MODE
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection     # Begin selection in copy mode.
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle  # Begin selection in copy mode.
bind-key -T copy-mode-vi 'y' send -X copy-selection      # Yank selection in copy mode.
unbind-key -T copy-mode-vi v

# Initialize TPM (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'


# copy paste over ssh:
# Pass OSC 52 clipboard sequences through to your local terminal
# tmux 3.3+: allow escape passthrough (covers OSC 52)
set -g allow-passthrough on

# Also let tmux itself use the clipboard when it can (copy-mode etc.)
set -g set-clipboard on

# (Optional but helpful) advertise clipboard feature to apps
# Only needed if your tmux is older / picky terminals:
set -as terminal-features ',xterm-256color:clipboard'

# Good defaults
set -g mouse on
set -g history-limit 100000
